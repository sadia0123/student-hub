<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - Student Hub</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        width: 100%;
        max-width: 400px;

        background: white;
        padding: 30px;

        border-radius: 16px;

        box-shadow:
            0 4px 20px rgba(0,0,0,0.08);
    }

    .login-card h1 {
        margin-bottom: 25px;
    }

    .login-card label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .login-card input {
        width: 100%;
        padding: 12px;

        margin-bottom: 18px;

        border: 1px solid #ddd;
        border-radius: 8px;
    }

    .login-card button {
        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 8px;

        background: #5548e8;
        color: white;

        font-weight: bold;
        cursor: pointer;
    }

    .login-card button:hover {
        background: #4338ca;
    }

    .error {
        color: red;
        margin-bottom: 15px;
    }

</style>


</head>

<body>


<div class="login-card">

    <h1>🔐 Login</h1>

    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>

</div>


</body>

</html>
